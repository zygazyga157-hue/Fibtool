name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies (core for tests)
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests ancient-science-of-numbers
      - name: Run tests
        run: |
          python -m pytest -q
